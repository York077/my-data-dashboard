<!DOCTYPE html>
<html lang='zh'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>公司业务数据实时大屏</title>
    <style>
        :root { --bg: #0b0f1a; --card: #161b29; --accent: #00d2ff; --green: #00ff88; --red: #ff4d4d; --text: #e0e6ed; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #2d3343; }
        .big-number { font-size: 32px; font-weight: bold; color: var(--accent); margin: 10px 0; }
        .progress-container { background: #2d3343; border-radius: 10px; height: 10px; margin: 15px 0; position: relative; }
        .progress-bar { height: 100%; border-radius: 10px; transition: width 1s; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #2d3343; }
        .rank-1 { color: #ffd700; }
        .pct-tag { padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <div class='header'>
        <h2 id='company-name'>载入中...</h2>
        <div id='update-time' style='color: #8492a6;'>更新时间：--</div>
    </div>
    <div class='grid'>
        <div class='card'>
            <h3>💰 大资金进展 (115%考核)</h3>
            <div class='big-number' id='big-fund-val'>$0</div>
            <div class='progress-container'><div id='big-fund-bar' class='progress-bar' style='background: #00d2ff;'></div></div>
            <div style='display:flex;justify-content:space-between;font-size:12px;'>
                <span>完成度: <b id='big-fund-pct'>0%</b></span>
                <span>目标: <span id='big-fund-target'>$0</span></span>
            </div>
        </div>
        <div class='card'>
            <h3>🛡️ 信保贴网实收</h3>
            <div class='big-number' id='libao-val'>$0</div>
            <div style='font-size:12px;color:#8492a6;'>完成率: <b id='libao-pct'>0%</b> | 目标: <span id='libao-target'>$0</span></div>
        </div>
        <div class='card'>
            <h3>📈 ACP 关联规模</h3>
            <div class='big-number' id='acp-val'>$0</div>
            <div style='font-size:12px;color:#8492a6;'>完成率: <b id='acp-pct'>0%</b> | 目标: <span id='acp-target'>$0</span></div>
        </div>
    </div>
    <div class='card' style='margin-top:20px;'>
        <h3>👤 9月员工英雄榜 (降序排名)</h3>
        <table>
            <thead><tr><th>排名</th><th>姓名</th><th>9月实收</th><th>完成率</th><th>状态</th></tr></thead>
            <tbody id='employee-table'></tbody>
        </table>
    </div>
    <script>
        fetch('data_cur.json?t=' + Date.now()).then(r => r.json()).then(data => {
            document.getElementById('company-name').textContent = data.company.name + ' - ' + data.company.quarter;
            document.getElementById('update-time').textContent = '更新时间：' + data.update_time;
            const fmt = v => '$' + v.toLocaleString();
            document.getElementById('big-fund-val').textContent = fmt(data.company.big_fund_actual);
            document.getElementById('big-fund-target').textContent = fmt(data.company.big_fund_target);
            const bfPct = (data.company.big_fund_actual / data.company.big_fund_target * 100).toFixed(1);
            document.getElementById('big-fund-pct').textContent = bfPct + '%';
            document.getElementById('big-fund-bar').style.width = Math.min(bfPct, 100) + '%';
            document.getElementById('libao-val').textContent = fmt(data.company.libao_actual);
            document.getElementById('libao-target').textContent = fmt(data.company.libao_target);
            document.getElementById('libao-pct').textContent = (data.company.libao_actual / data.company.libao_target * 100).toFixed(1) + '%';
            document.getElementById('acp-val').textContent = fmt(data.company.acp_actual);
            document.getElementById('acp_target').textContent = fmt(data.company.acp_target);
            const tbody = document.getElementById('employee-table');
            data.employees.forEach((emp, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${i+1}</td><td>${emp.name}</td><td>${fmt(emp.val)}</td><td>${emp.pct}%</td><td><span class='pct-tag' style='background:${emp.pct>=66?"#00ff8822":"#ff4d4d22"};color:${emp.pct>=66?"#00ff88":"#ff4d4d"}'>${emp.pct>=66?"达标":"预警"}</span></td>`;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
