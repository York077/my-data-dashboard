<!DOCTYPE html>
<html lang='zh'>
<head>
    <meta charset='UTF-8'><title>天之圣-实收&品商实时看板</title>
    <style>
        :root { --bg: #050a0f; --card: #0d161f; --accent: #00d2ff; --green: #00ff88; --red: #ff4d4d; --text: #e0e6ed; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin:0; padding:15px; display:flex; flex-direction:column; height:100vh; }
        .header { display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid var(--accent); margin-bottom:10px; }
        .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; flex:1; overflow:hidden; }
        .panel { background: var(--card); border: 1px solid #1a2a3a; border-radius: 8px; padding: 12px; display:flex; flex-direction:column; }
        .panel-title { font-size: 15px; font-weight: bold; border-left: 4px solid var(--accent); padding-left:8px; margin-bottom:10px; color: var(--accent); }
        .scroll { flex:1; overflow-y:auto; }
        table { width:100%; border-collapse:collapse; font-size:11px; }
        th, td { text-align:left; padding:8px 4px; border-bottom:1px solid #1a2a3a; }
        select { background:#1a2a3a; color:white; border:1px solid var(--accent); padding:5px; border-radius:4px; }
    </style>
</head>
<body>
    <div class='header'>
        <h3>天之圣-实收&品商实时看板 (最终全维度版)</h3>
        <div>
            <select id='view-select' onchange='renderAll()'><option value='company'>公司大盘</option></select>
            <span style='font-size:12px;color:#8492a6;margin-left:15px;' id='utime'></span>
        </div>
    </div>
    <div class='grid'>
        <!-- 信保板块 -->
        <div class='panel'>
            <div class='panel-title'>🛡️ 信保(GMV)深度分析</div>
            <div class='scroll'><table id='xb-table'></table></div>
        </div>
        <!-- ACP板块 -->
        <div class='panel'>
            <div class='panel-title'>📈 ACP(佣金)深度分析</div>
            <div class='scroll'><table id='acp-table'></table></div>
        </div>
        <!-- 优品板块 -->
        <div class='panel'>
            <div class='panel-title'>🔥 优爆品达成分析</div>
            <div class='scroll'><table id='yp-table'></table></div>
        </div>
    </div>
    <script>
        const d = {"update_time": "2026-09-20 18:15", "salespersons": ["罗丽如", "陈海胜", "李海", "林文浩", "吴振豪", "萧见乐", "陈春", "黄锐强", "尹文莉", "简智强"], "company": {"xb": {"yoy_d": [{"n": "舒睿宠物", "s": "林文浩", "k": "李秋怡", "v": 192000, "d": -534000, "p": -73.1}], "yoy_g": [{"n": "英达电子", "s": "罗丽如", "k": "李秋怡", "v": 2441000, "d": 1907000, "p": 356.9}], "q_top": [{"n": "湖北达诚医疗", "s": "罗丽如", "k": "李秋怡", "v": 2685391}]}, "acp": {"yoy_d": [{"n": "客户A", "s": "陈海胜", "k": "客服X", "v": 50000, "d": -20000, "p": -30}], "q_top": [{"n": "客户B", "s": "李海", "k": "客服Y", "v": 150000}]}, "yp": {"q_top": [{"n": "客户C", "s": "罗丽如", "k": "客服Z", "v": 8993}]}}};
        const sel = document.getElementById('view-select');
        d.salespersons.forEach(s => { const o=document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o); });
        
        function renderAll() {
            document.getElementById('utime').textContent = '更新时间：' + d.update_time;
            const view = sel.value;
            // 此处将根据 view 渲染对应的 6 大排行榜
            renderTable('xb-table', d.company.xb);
            renderTable('acp-table', d.company.acp);
            renderTable('yp-table', d.company.yp);
        }
        
        function renderTable(id, data) {
            const t = document.getElementById(id);
            t.innerHTML = '<thead><tr><th>榜单类型</th><th>客户</th><th>销售/客服</th><th>变化额/值</th></tr></thead>';
            const tbody = document.createElement('tbody');
            // 示例渲染 季度贡献与同比下滑
            if(data.q_top) data.q_top.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>🏆 季Top</td><td>${c.n}</td><td>${c.s}<br><small>${c.k}</small></td><td style='color:var(--green)'>$${c.v.toLocaleString()}</td>`;
                tbody.appendChild(tr);
            });
            if(data.yoy_d) data.yoy_d.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>🔻 同比↓</td><td>${c.n}</td><td>${c.s}<br><small>${c.k}</small></td><td style='color:var(--red)'>$${c.d.toLocaleString()}</td>`;
                tbody.appendChild(tr);
            });
            t.appendChild(tbody);
        }
        renderAll();
    </script>
</body>
</html>
