        const fmt = v => '$' + Math.round(v || 0).toLocaleString();
        const getC = p => p>=80?'#00ff88':(p>=50?'#ffa500':'#ff4d4d');

        window.showTab = function(type) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn-' + type);
            if(btn) btn.classList.add('active');
            const tbody = document.getElementById('client-rank-body');
            tbody.innerHTML = '';
            const list = dashboardData.company.xb[type];
            if(!list) return;
            list.forEach(c => {
                const tr = document.createElement('tr');
                const diffClr = c.d < 0 ? 'var(--red)' : 'var(--green)';
                tr.innerHTML = `<td><b style='color:#fff'>${c.n.substring(0,8)}</b><br><small style='color:#8492a6'>${c.s}|${c.k}</small></td><td>${c.s}</td><td style='color:${diffClr}'>${c.d < 0 ? '' : '+'}${fmt(c.d)}</td><td style='color:${diffClr}'>${c.p}%</td>`;
                tbody.appendChild(tr);
            });
        }

        function init() {
            const d = dashboardData;
            document.getElementById('c-name').textContent = "天之圣外贸服务(广东)有限公司 - FY27Q2";
            document.getElementById('u-time').textContent = '数据校准时间：' + d.update_time;

            showTab('yoy_d');

            // Render Contribution tables
            const qBody = document.getElementById('q-contrib-body');
            d.company.xb.q_top.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><b>${c.n.substring(0,10)}</b><br><small>${c.s}</small></td><td>${c.s}</td><td>${fmt(c.v)}</td>`;
                qBody.appendChild(tr);
            });
            const mBody = document.getElementById('m-contrib-body');
            d.company.xb.m_top.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><b>${c.n.substring(0,10)}</b><br><small>${c.s}</small></td><td>${c.s}</td><td>${fmt(c.v)}</td>`;
                mBody.appendChild(tr);
            });

            // Risk Analysis
            const riskBox = document.getElementById('risk-box');
            d.company.xb.yoy_d.slice(0, 4).forEach(c => {
                const div = document.createElement('div');
                div.className = 'alert-row';
                div.innerHTML = `<b>🔴 极高风险: ${c.n}</b><br>销售:${c.s} | 客服:${c.k}<br>同比下跌 ${fmt(Math.abs(c.d))} (${c.p}%)。建议回访。`;
                riskBox.appendChild(div);
            });

            // Employee bars (using previous Turn's data)
            const pB = document.getElementById('p-bars');
            const employees = [
                {n:'罗丽如',mq:113.2, mm:74.1}, {n:'陈海胜',mq:71.1, mm:61.6}, {n:'李海',mq:87.5, mm:55.5}, 
                {n:'林文浩',mq:71.6, mm:37.8}, {n:'吴振豪',mq:69.3, mm:54.5}, {n:'萧见乐',mq:69.3, mm:39.2}
            ];
            employees.forEach(e => {
                const div = document.createElement('div');
                div.style.marginBottom = '8px';
                div.innerHTML = `<div style='font-size:10px;'>${e.n} (${e.mq}% | ${e.mm}%)</div>
                                 <div style='background:#1c2b3a; height:5px; border-radius:3px; margin:2px 0;'><div style='height:100%; width:${Math.min(e.mq,100)}%; background:${getC(e.mq)}; border-radius:3px;'></div></div>
                                 <div style='background:#1c2b3a; height:3px; border-radius:2px;'><div style='height:100%; width:${Math.min(e.mm,100)}%; background:${getC(e.mm)}; border-radius:2px;'></div></div>`;
                pB.appendChild(div);
            });
        }
        init();
    </script>
